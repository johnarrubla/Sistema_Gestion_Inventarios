<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Gestión de Inventarios</title>
  <!-- Framework CSS: Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Tarjeta Principal de Login -->
  <div class="bg-white rounded-xl shadow-lg border border-slate-200 w-full max-w-md p-8">
    
    <!-- Encabezado / Logo -->
    <div class="text-center mb-8">
      <div class="bg-indigo-600 text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 shadow-md">
        <!-- Ícono de Inventario / Caja -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Control de Inventario</h1>
      <p class="text-sm text-slate-500 mt-1">Selecciona un usuario de prueba para continuar</p>
    </div>

    <!-- Alerta de Error (Oculta por defecto) -->
    <div id="login-alert" class="hidden mb-5 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="login-alert-text">Usuario no encontrado.</span>
    </div>

    <!-- Formulario de Inicio de Sesión -->
    <form id="login-form" class="space-y-5">
      
      <!-- Selector Rápido de Usuarios de Prueba -->
      <div>
        <label for="test-user-select" class="block text-xs font-semibold uppercase text-slate-600 mb-2">
          Usuarios de Prueba Preconfigurados
        </label>
        <select id="test-user-select" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
          <option value="">-- Elige un usuario rápido --</option>
          <option value="admin">Carlos Admin (Rol: ADMIN)</option>
          <option value="empleado">Ana Empleado (Rol: EMPLOYEE)</option>
        </select>
      </div>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-slate-400 text-xs font-medium uppercase">O ingresa manualmente</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- Input Manual de Nombre de Usuario -->
      <div>
        <label for="username-input" class="block text-xs font-semibold uppercase text-slate-600 mb-2">
          Nombre de Usuario
        </label>
        <input 
          type="text" 
          id="username-input" 
          placeholder="Ej: admin o empleado" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
          required
        >
      </div>

      <!-- Botón de Ingreso -->
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2"
      >
        <span>Ingresar al Sistema</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

    </form>

    <!-- Footer de Ayuda -->
    <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-400">
      <p>Proyecto Frontend II • Gestión de Inventario</p>
      <p class="mt-1 font-mono">Roles: ADMIN (Acceso Total) | EMPLOYEE (Entradas/Salidas)</p>
    </div>

  </div>

  <!-- Inclusión de Módulos JavaScript -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Redireccionar al Dashboard si ya existe una sesión activa
      if (getCurrentUser()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const loginForm = document.getElementById('login-form');
      const testUserSelect = document.getElementById('test-user-select');
      const usernameInput = document.getElementById('username-input');
      const alertEl = document.getElementById('login-alert');
      const alertTextEl = document.getElementById('login-alert-text');

      // 2. Sincronizar el select de usuarios de prueba con el input de texto
      testUserSelect.addEventListener('change', (e) => {
        if (e.target.value) {
          usernameInput.value = e.target.value;
          alertEl.classList.add('hidden');
        }
      });

      // 3. Manejar el evento de inicio de sesión
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();

        if (!username) return;

        // Intentar autenticar mediante auth.js
        const success = login(username);

        if (success) {
          // Redirigir al dashboard tras un login correcto
          window.location.href = 'dashboard.html';
        } else {
          // Mostrar mensaje de error si el usuario no existe en localStorage
          alertTextEl.textContent = `El usuario "${username}" no existe. Prueba con "admin" o "empleado".`;
          alertEl.classList.remove('hidden');
        }
      });
    });
  </script>

</body>
</html>
